# بيئة معزولة لتشغيل E2E وفحص FHIR في CI وعلى الجهاز المحلي.
# نفس خدمات docker-compose.yml لكن بمنافذ وVolumes منفصلة ودون إعادة تحميل.
name: cliniccare-test

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: cliniccare_test
      POSTGRES_USER: cliniccare_migrator
      POSTGRES_PASSWORD: test_migrator_password
    ports:
      - '127.0.0.1:5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cliniccare_migrator -d cliniccare_test']
      interval: 3s
      timeout: 3s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_test_access
      MINIO_ROOT_PASSWORD: minio_test_secret
    ports:
      - '127.0.0.1:9100:9000'
    tmpfs:
      - /data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 3s
      timeout: 3s
      retries: 15

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ['/bin/sh', '/minio-init.sh']
    environment:
      S3_ACCESS_KEY: minio_test_access
      S3_SECRET_KEY: minio_test_secret
      S3_BUCKET: cliniccare-docs-test
    volumes:
      - ./minio-init.sh:/minio-init.sh:ro

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - '127.0.0.1:8026:8025'
      - '127.0.0.1:1026:1025'

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://cliniccare_migrator:test_migrator_password@postgres:5432/cliniccare_test
      SESSION_SECRET: test_session_secret_at_least_32_bytes
      WEB_ORIGIN: http://web:3000
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9100
      S3_BUCKET: cliniccare-docs-test
      S3_ACCESS_KEY: minio_test_access
      S3_SECRET_KEY: minio_test_secret
      SMTP_URL: smtp://mailhog:1025
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - '127.0.0.1:4001:4000'
    command: sh -c "pnpm prisma migrate deploy && node apps/api/dist/main.js"

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://api:4000
    depends_on:
      - api
    ports:
      - '127.0.0.1:3001:3000'
