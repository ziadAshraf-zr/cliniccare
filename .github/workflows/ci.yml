name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  PNPM_VERSION: '10.28.0'
  NODE_VERSION: '22'

jobs:
  quality:
    name: lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks يحتاج التاريخ الكامل لفحص نطاق الـ commits

      - name: Gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm gen:prisma

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit + integration tests
        run: pnpm test

      - name: Dependency audit (high and above)
        run: pnpm audit --prod --audit-level=high
        continue-on-error: true # يتحول إلى حاجب صريح بعد استقرار الاعتماديات في الأسبوع 3

  build:
    name: build web + api images
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build api image
        run: docker build -f apps/api/Dockerfile -t cliniccare-api:ci .

      - name: Build web image
        run: docker build -f apps/web/Dockerfile -t cliniccare-web:ci .
